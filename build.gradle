plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Create Fabric 本体
	maven { url = "https://mvn.devos.one/snapshots" }
	// Porting Lib
	maven { url = "https://mvn.devos.one/releases" }
	// net.createmod（Catnip/Ponder）与 Flywheel
	maven { url = "https://maven.createmod.net" }
	// ForgeConfigApiPort
	maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
	// reach-entity-attributes（Create 的运行时依赖，Porting Lib:attributes 传递引入）
	maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
	// Copycats+ —— 仅用于可选的兼容判断
	maven {
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

/*
 * Data Generation。
 *
 * 注意 datagen 的输入是 src/datagen/resources/lang/*.json（见 ModLanguageProvider 用
 * -Dmaris.datagen.project-dir 读它），输出是 src/main/generated（既是输出目录也是 main 源集的
 * 资源目录，所以生成物会直接打进 jar）。
 *
 * 踩过的坑：loom 生成的 runDatagen 没有把 src/datagen 声明成任务输入，所以**改了语言文件之后
 * Gradle 仍然认为 runDatagen 是最新的、不会重跑**，于是 jar 里带着几天前的旧 lang 文件，
 * 游戏里满屏裸翻译键。下面给这个任务补上输入声明，改语言文件就会自动触发重跑。
 */
loom {
	splitEnvironmentSourceSets()

	runs {
		datagen {
			inherit server
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file('src/main/generated')}"
			vmArg "-Dfabric-api.datagen.modid=maris-decoration"
			vmArg "-Dmaris.datagen.project-dir=${projectDir}"
			runDir "build/datagen"
		}
	}

	mods {
		"maris-decoration" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Create —— 伪装方块必需依赖（与 Create: Copycats+ 做法一致）
	// Flywheel / Ponder / Registrate / Porting Lib 由 Create 传递引入
	modImplementation "com.simibubi.create:create-fabric:${project.create_version}"
	// Create Fabric 的依赖声明里要求 forgeconfigapiport，显式引入以免解析不到
	modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

	// Copycats+：只做编译期引用，用于把其它伪装方块也挡在材质之外。
	// 用 modCompileOnly 而不是 modImplementation —— 这是可选的兼容而非依赖，
	// 运行时会用 isModLoaded 判断，没装 Copycats+ 也照常工作。
	modCompileOnly "maven.modrinth:copycats:${project.copycats_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

sourceSets.main.resources.srcDir "src/main/generated"

/*
 * 给 runDatagen 补上输入声明。
 *
 * datagen 真正的输入源是 src/datagen/resources（ModLanguageProvider 通过
 * -Dmaris.datagen.project-dir 去读它），而 loom 默认只把源码与资源算作输入。
 * 实测 loom 生成的 run 任务本来就不会被判定为 UP-TO-DATE（每次都真的执行），
 * 所以这份声明目前是「把意图写清楚」而不是「修一个能复现的跳过」；
 * 真正兜住「改了语言却忘了跑 datagen」的是下面的 checkDatagenFresh。
 */
tasks.matching { it.name == 'runDatagen' }.configureEach {
	inputs.dir(file("src/datagen"))
	outputs.dir(file("src/main/generated"))
}

/*
 * 检查 datagen 产物是否过期。挂在 build 上，过期就直接构建失败。
 *
 * 这是本轮那个「游戏里满屏裸翻译键」事故的直接防线。事故链条是：
 *   改了 src/datagen/resources/lang/*.json
 *   → 只跑了 compileJava / runServer，没跑 runDatagen
 *   → src/main/generated 里的 lang 还是几天前的旧文件（它同时是 main 源集的资源目录）
 *   → 打进 jar 的自然是旧词条
 * 这条链上没有任何一步会报错，只有进游戏才看得出来。所以让构建替人记得检查。
 * 只比较语言文件，因为它们是唯一「纯手工维护 + 必须经过 datagen」的输入。
 */
tasks.register('checkDatagenFresh') {
	group = "verification"
	description = "检查 src/datagen 的语言文件是否比生成物新（新则说明忘了跑 runDatagen）"
	doLast {
		def stale = []
		file("src/datagen/resources/lang").listFiles()?.each { source ->
			def generated = file("src/main/generated/assets/maris-decoration/lang/${source.name}")
			if (!generated.exists()) {
				stale << "${source.name}: 生成物不存在"
			} else if (source.lastModified() > generated.lastModified()) {
				stale << "${source.name}: 源文件比生成物新"
			}
		}
		if (!stale.isEmpty()) {
			throw new GradleException(
					"datagen 产物过期：\n  - " + stale.join("\n  - ")
							+ "\n请运行 ./gradlew runDatagen 后重试（否则 jar 里会带着旧的翻译，游戏内显示裸 key）。")
		}
	}
}

tasks.named('build') { dependsOn 'checkDatagenFresh' }

/*
 * 伪装放置器的代码级自检。
 *
 * 跑法：tools/run-harness.ps1（或者手工 `./gradlew runServer < tools/harness-server-stdin.txt`，
 * 再读 run/maris-placer-selftest.txt）。
 *
 * 为什么<b>不</b>做成一个 Gradle JavaExec 任务：dev-launch-injector 需要「子进程继承的
 * 工作目录 + 系统属性」才能把 Knot 类加载器装对；由 JavaExec 直接拉起时会崩在
 * 「trying to load FabricLoaderImpl from target class loader」。
 * 而 gradlew runServer（loom 自己生成的那个任务）+ shell 级 stdin 重定向是稳定的，
 * 因为它走的就是 loom 原本的启动路径。所以自检由脚本驱动，不在这里另造一个 run 任务。
 *
 * 世界隔离由脚本负责：它把 server.properties 的 level-name 换成 harness、level-type 换成
 * 超平坦（其余键原样保留），于是自检跑在独立的超平坦世界里，开发存档的 world/ 不受影响。
 */

/*
 * Copycats+ 的验证记录（2026-09-23，用 copycats 3.0.10+mc.1.20.1-fabric 的 jar 放进 run/mods/ 实跑）。
 *
 * 结果：自检 160 项、0 失败，两个 adapter 的真实运行时路径都跑通了：
 *   - copycats:multistate  → copycats:copycat_board（storageProperties = [east,south,north,west,up,down]），
 *                            六个 part 的材质都写进了 MaterialItemStorage；
 *   - copycats:ordinary    → copycats:copycat_block 等（方块实体是 CCCopycatBlockEntity），
 *                            材质与 consumedItem 都写对了。
 *
 * 这一趟还抓出两个真实缺陷，已修：
 *   1. Copycats+ 用 mixin 给 Create 的 copycat_step / copycat_panel 也挂上了 ICopycatBlock，
 *      导致它们被 copycats:ordinary 抢走（而它们的方块实体是 Create 的 CopycatBlockEntity）。
 *      修法：Create adapter 的优先级提到 copycats:ordinary 之前。
 *   2. Copycats+ 的 multistate 方块默认状态一个 part 都没有，GUI 侧会把所有材质槽标成
 *      「结构不存在」、玩家无从配置。修法：adapter 自己把 storageProperties() 全部置 true
 *      提升出一个展示状态。
 *
 * 平日开发运行时<b>保持不带 Copycats+</b>（本项目的依赖设计就是可选兼容的 modCompileOnly）。
 * 需要重跑这份验证时，把 copycats 的 jar 放回 run/mods/ 再执行 tools/run-harness.ps1 即可。
 */

