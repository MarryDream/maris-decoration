plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Create Fabric 本体
	maven { url = "https://mvn.devos.one/snapshots" }
	// Porting Lib
	maven { url = "https://mvn.devos.one/releases" }
	// net.createmod（Catnip/Ponder）与 Flywheel
	maven { url = "https://maven.createmod.net" }
	// ForgeConfigApiPort
	maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
	// reach-entity-attributes（Create 的运行时依赖，Porting Lib:attributes 传递引入）
	maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
	// Copycats+ —— 仅用于可选的兼容判断
	maven {
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	runs {
		datagen {
			inherit server
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file('src/main/generated')}"
			vmArg "-Dfabric-api.datagen.modid=maris-decoration"
			vmArg "-Dmaris.datagen.project-dir=${projectDir}"
			runDir "build/datagen"
		}
	}

	mods {
		"maris-decoration" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Create —— 伪装方块必需依赖（与 Create: Copycats+ 做法一致）
	// Flywheel / Ponder / Registrate / Porting Lib 由 Create 传递引入
	modImplementation "com.simibubi.create:create-fabric:${project.create_version}"
	// Create Fabric 的依赖声明里要求 forgeconfigapiport，显式引入以免解析不到
	modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

	// Copycats+：只做编译期引用，用于把其它伪装方块也挡在材质之外。
	// 用 modCompileOnly 而不是 modImplementation —— 这是可选的兼容而非依赖，
	// 运行时会用 isModLoaded 判断，没装 Copycats+ 也照常工作。
	modCompileOnly "maven.modrinth:copycats:${project.copycats_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

sourceSets.main.resources.srcDir "src/main/generated"
