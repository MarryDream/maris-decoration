# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.17.2

# Mod Properties
mod_version=1.0.6
maven_group=marrydream.marisdecoration
archives_base_name=maris-decoration

# Dependencies
fabric_version=0.92.12+1.20.1

# Create —— 伪装方块必需依赖（与 Create: Copycats+ 做法一致）
# Create Fabric 1.20.1 发布在 devos.one snapshots，不在 maven.createmod.net
create_version=6.0.8.1+build.1744-mc1.20.1
# Create 的 fabric.mod.json 声明依赖 forgeconfigapiport
forge_config_api_port_version=8.0.0

# Copycats+ —— 只用于可选的兼容判断（modCompileOnly），不是硬依赖
copycats_version=3.0.10+mc.1.20.1-fabric